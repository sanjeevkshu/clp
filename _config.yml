title: "CLP | Continuous Learning & Progressive Evolution"
description: "Ideas, skills and experiences to help you learn continuously and turn knowledge into progress."
url: "https://clpvriksha.com"
baseurl: ""
lang: "en"
markdown: kramdown
permalink: pretty
exclude: [README.md, AGENTS.md, Gemfile, Gemfile.lock, docs, skills, vendor]
plugins: []
collections:
  media:
    output: true
    permalink: /media/:name/
defaults:
  - scope:
      path: ""
      type: media
    values:
      layout: media
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default
