title: "CLP | Continuous Learning & Progressive Evolution"
description: "Ideas, skills and experiences to help you learn continuously and turn knowledge into progress."
url: "https://clpvriksha.com"
baseurl: ""
lang: "en"
markdown: kramdown
permalink: pretty
exclude: [README.md, AGENTS.md, Gemfile, Gemfile.lock, docs, skills, vendor]
plugins: []

# Public analytics identifiers; no credentials or secrets are stored here.
# Collection is enabled only on production and only after visitor opt-in.
analytics:
  ga4_measurement_id: "G-YMJS96D5TZ"
  gtm_container_id: "GTM-KQ49L3GG"
collections:
  media:
    output: true
    permalink: /media/:name/
defaults:
  - scope:
      path: ""
      type: media
    values:
      layout: media
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default
