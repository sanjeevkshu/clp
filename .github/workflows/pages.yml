name: Deploy CLP website and GitHub Pages PR preview
on:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
# Keep production Pages deploys serialized, but let a newer commit on the same
# PR supersede an obsolete validation run. PR checks no longer block production.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('clp-pr-{0}', github.event.pull_request.number) || 'pages-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      preview_slug: ${{ steps.preview.outputs.slug }}
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.repository.default_branch || github.ref_name }}
          path: production-source
      - name: Checkout pull request source
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: preview-source
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: production-source
      - name: Prepare preview path
        id: preview
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          slug="$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-|-$//g')"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
      # PR checks validate the proposed site only. Production build and strict
      # custom-domain checks run only for pushes to the production branch.
      - name: Build production site from source
        if: github.event_name != 'pull_request'
        working-directory: production-source
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --source "$GITHUB_WORKSPACE/production-source" --destination "$GITHUB_WORKSPACE/_site"
      - name: Validate production site
        if: github.event_name != 'pull_request'
        run: |
          node --check production-source/assets/js/main.js
          node --check production-source/assets/js/analytics-consent.js
          test -f _site/index.html
          test -f _site/assets/js/main.js
          test -f _site/assets/js/analytics-consent.js
          test -f _site/privacy/index.html
          grep -q 'data-analytics-enabled="true"' _site/index.html
          grep -q 'data-gtm-id="GTM-KQ49L3GG"' _site/index.html
          grep -q 'Privacy choices' _site/index.html
          grep -q 'https://www.googletagmanager.com' _site/index.html
          test -f _site/assets/css/styles.css
          test -f _site/assets/css/responsive-polish.css
          test -f _site/assets/css/editorial-media.css
          test -f _site/assets/images/clp-mark.svg
          test -f _site/assets/images/clp-home-hero.png
          grep -q 'id="site-nav"' _site/index.html
          grep -q 'id="home-latest"' _site/index.html
          grep -q 'id="home-pathways"' _site/index.html
          grep -q 'clp-hero-drift' _site/assets/css/styles.css
          grep -q 'data-home-filter' _site/index.html
          test -f _site/CNAME
          grep -q '^clpvriksha.com$' _site/CNAME
          grep -q 'href="/assets/css/styles.css' _site/index.html
          grep -q 'href="/assets/css/responsive-polish.css' _site/index.html
          grep -q 'src="/assets/js/main.js' _site/index.html
          if grep -qE '(href|src)="/clp/assets/' _site/index.html; then
            echo "ERROR: Production HTML contains old /clp asset paths."
            exit 1
          fi
          echo "Production homepage, assets, custom domain, JavaScript syntax and interaction hooks validated."
      - name: Build and validate pull request preview
        if: github.event_name == 'pull_request'
        working-directory: production-source
        env:
          JEKYLL_ENV: preview
        run: |
          bundle exec jekyll build --source "$GITHUB_WORKSPACE/preview-source" --destination "$GITHUB_WORKSPACE/_preview_site" --baseurl "${{ steps.pages.outputs.base_path }}/previews/${{ steps.preview.outputs.slug }}"
          printf 'User-agent: *\nDisallow: /\n' > "$GITHUB_WORKSPACE/_preview_site/robots.txt"
          preview_root="$GITHUB_WORKSPACE/_preview_site"
          node --check "$GITHUB_WORKSPACE/preview-source/assets/js/main.js"
          node --check "$GITHUB_WORKSPACE/preview-source/assets/js/analytics-consent.js"
          test -f "$preview_root/index.html"
          grep -q 'name="robots" content="noindex,nofollow"' "$preview_root/index.html"
          grep -q 'data-analytics-enabled="false"' "$preview_root/index.html"
          grep -q 'data-gtm-id=""' "$preview_root/index.html"
          grep -q 'Privacy choices' "$preview_root/index.html"
          if grep -q 'data-gtm-id="GTM-KQ49L3GG"' "$preview_root/index.html"; then
            echo "ERROR: Preview HTML exposes the production GTM container ID."
            exit 1
          fi
          if grep -q 'https://www.googletagmanager.com' "$preview_root/index.html"; then
            echo "ERROR: Preview HTML allows or loads the production GTM endpoint."
            exit 1
          fi
          test -f "$preview_root/privacy/index.html"
          test -f "$preview_root/blog/index.html"
          test -f "$preview_root/media/index.html"
          test -f "$preview_root/blog/contribute/index.html"
          test -f "$preview_root/media/contribute/index.html"
          test -f "$preview_root/launch/index.html"
          test -f "$preview_root/media/featured-video/index.html"
          grep -q "A new journey begins" "$preview_root/index.html"
          grep -q 'clp-launch-card' "$preview_root/index.html"
          grep -q 'Explore our launch story' "$preview_root/index.html"
          if sed -n '/clp-launch-card/,/<\/section>/p' "$preview_root/index.html" | grep -q 'Watch the launch film'; then
            echo "ERROR: Launch card contains a competing secondary CTA."
            exit 1
          fi
          grep -q 'data-theme="light"' "$preview_root/assets/css/editorial-media.css" || grep -q 'data-theme=\\\"light\\\"' "$preview_root/assets/css/editorial-media.css"
          # Validate the revised footer structure and current stylesheet cache key.
          grep -q 'footer-navigation' "$preview_root/index.html"
          grep -q 'Discover CLP' "$preview_root/index.html"
          grep -q 'Resources' "$preview_root/index.html"
          grep -q 'Our Story' "$preview_root/index.html"
          grep -q 'About Us' "$preview_root/index.html"
          grep -q '20261020-footer-two-column-dark-contrast-v1' "$preview_root/index.html"
          grep -q "CLP Vriksha" "$preview_root/launch/index.html"
          grep -q 'Content-Security-Policy' "$preview_root/index.html"
          grep -q 'href="/previews/${{ steps.preview.outputs.slug }}/blog/"' "$preview_root/index.html"
          grep -q 'href="/previews/${{ steps.preview.outputs.slug }}/media/"' "$preview_root/index.html"
          grep -q 'youtube-nocookie.com/embed/' "$GITHUB_WORKSPACE/preview-source/_layouts/media.html"
          test -f "$GITHUB_WORKSPACE/preview-source/_layouts/post.html"
          test -f "$GITHUB_WORKSPACE/preview-source/docs/templates/blog-post-template.md"
          test -f "$GITHUB_WORKSPACE/preview-source/docs/templates/media-item-template.md"
          echo "Built and checked noindex-protected feature branch preview at /previews/${{ steps.preview.outputs.slug }}/."
      - name: Upload production site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  deploy:
    # PR preview publication is handled by the trusted workflow_run workflow.
    if: github.event_name != 'pull_request'
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
