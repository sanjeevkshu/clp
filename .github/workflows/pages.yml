name: Deploy CLP website and GitHub Pages PR preview
on:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      preview_slug: ${{ steps.preview.outputs.slug }}
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.repository.default_branch || github.ref_name }}
          path: production-source
      - name: Checkout pull request source
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: preview-source
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: production-source
      - name: Prepare preview path
        id: preview
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          slug="$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-|-$//g')"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
      - name: Build production site from source
        working-directory: production-source
        env:
          JEKYLL_ENV: production
        run: |
          # On pushes, this is the custom-domain production source. On PRs, this
          # builds the current production baseline separately from the preview.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            bundle exec jekyll build --source "$GITHUB_WORKSPACE/production-source" --destination "$GITHUB_WORKSPACE/_site" --baseurl "${{ steps.pages.outputs.base_path }}"
          else
            bundle exec jekyll build --source "$GITHUB_WORKSPACE/production-source" --destination "$GITHUB_WORKSPACE/_site"
          fi
      - name: Validate production site
        run: |
          node --check production-source/assets/js/main.js
          test -f _site/index.html
          test -f _site/assets/js/main.js
          test -f _site/assets/css/styles.css
          test -f _site/assets/css/responsive-polish.css
          test -f _site/assets/images/clp-mark.svg
          test -f _site/assets/images/clp-home-hero.png
          grep -q 'id="site-nav"' _site/index.html
          grep -q 'id="home-latest"' _site/index.html
          grep -q 'id="home-pathways"' _site/index.html
          grep -q 'clp-hero-drift' _site/assets/css/styles.css
          grep -q 'data-home-filter' _site/index.html
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            grep -qE 'href="/(clp/)?assets/css/styles.css' _site/index.html
            echo "Current production baseline validated with its existing GitHub Pages base path."
          else
            test -f _site/CNAME
            grep -q '^clpvriksha.com$' _site/CNAME
            grep -q 'href="/assets/css/styles.css' _site/index.html
            grep -q 'href="/assets/css/responsive-polish.css' _site/index.html
            grep -q 'src="/assets/js/main.js' _site/index.html
            if grep -qE '(href|src)="/clp/assets/' _site/index.html; then
              echo "ERROR: Production HTML contains old /clp asset paths."
              exit 1
            fi
            echo "Custom-domain asset paths and CNAME validated."
          fi
          echo "Production homepage, asset files, JavaScript syntax and interaction hooks validated."
      - name: Build pull request preview
        if: github.event_name == 'pull_request'
        working-directory: production-source
        env:
          JEKYLL_ENV: preview
        run: |
          bundle exec jekyll build --source "$GITHUB_WORKSPACE/preview-source" --destination "$GITHUB_WORKSPACE/_preview_site" --baseurl "${{ steps.pages.outputs.base_path }}/previews/${{ steps.preview.outputs.slug }}"
          mkdir -p "$GITHUB_WORKSPACE/_site/previews/${{ steps.preview.outputs.slug }}"
          cp -a "$GITHUB_WORKSPACE/_preview_site/." "$GITHUB_WORKSPACE/_site/previews/${{ steps.preview.outputs.slug }}/"
          printf 'User-agent: *\nDisallow: /\n' > "$GITHUB_WORKSPACE/_site/previews/${{ steps.preview.outputs.slug }}/robots.txt"
          test -f "$GITHUB_WORKSPACE/_site/previews/${{ steps.preview.outputs.slug }}/index.html"
          grep -q 'name="robots" content="noindex,nofollow"' "$GITHUB_WORKSPACE/_site/previews/${{ steps.preview.outputs.slug }}/index.html"
          echo "Built and checked noindex-protected feature branch preview at /previews/${{ steps.preview.outputs.slug }}/."
      - name: Upload combined production and preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  deploy:
    # PR artifacts are deployed by the trusted workflow_run workflow from master.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
