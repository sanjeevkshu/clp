name: Deploy CLP website to GitHub Pages
on:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
      - name: Validate homepage and interaction assets
        run: |
          node --check assets/js/main.js
          test -f _site/index.html
          test -f _site/assets/js/main.js
          test -f _site/assets/css/styles.css
          test -f _site/assets/images/clp-mark.svg
          test -f _site/assets/images/clp-home-hero.png
          grep -q 'id="site-nav"' _site/index.html
          grep -q 'id="home-latest"' _site/index.html
          grep -q 'id="home-pathways"' _site/index.html
          grep -q 'clp-hero-drift' _site/assets/css/styles.css
          grep -q 'data-home-filter' _site/index.html
          echo "Homepage markup, assets, JavaScript syntax, filters and photo-motion hooks validated."
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
