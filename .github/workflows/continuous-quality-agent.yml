name: CLP Continuous Quality and Remediation Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "23 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clp-continuous-quality-${ github.event.pull_request.number || github.ref }
  cancel-in-progress: true

jobs:
  quality:
    name: Continuous SEO, AEO and site quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR source or production branch
        uses: actions/checkout@v4
        with:
          ref: ${ github.event.pull_request.head.sha || github.sha }
      - name: Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build production-mode site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination _site
      - name: Run SEO and sitemap guardrails
        run: |
          python3 scripts/validate_seo.py _site production
          python3 scripts/validate_sitemap.py _site
      - name: Run bounded deterministic auto-remediation
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/auto_remediate.py $(git ls-files '*.md' '*.markdown' '*.html' '*.css' '*.js' '*.json' '*.yml' '*.yaml' '*.txt' '*.xml' '*.py')
      - name: Report safe fixes without bypassing review
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet; then
            {
              echo "## CLP safe auto-remediation"
              echo
              echo "The bounded fixer normalized whitespace only. These edits are proposed on the PR branch and still require review."
              echo
              git --no-pager diff --stat
            } >> "$GITHUB_STEP_SUMMARY"
            git --no-pager diff --check
          else
            echo "No safe deterministic fixes were needed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Live production smoke test (scheduled and manual runs only)
        if: github.event_name != 'pull_request'
        env:
          SITE_URL: https://clpvriksha.com
        run: |
          set -euo pipefail
          for path in / /robots.txt /sitemap.xml /sitemap/ /learn/; do
            code="$(curl --silent --show-error --location --output /tmp/clp-response --write-out '%{http_code}' "$SITE_URL$path")"
            echo "$code $path"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "Unexpected HTTP status $code for $path"
              exit 1
            fi
            if [ ! -s /tmp/clp-response ]; then
              echo "Empty response for $path"
              exit 1
            fi
          done
          grep -q 'Sitemap:' <(curl --silent --show-error --location "$SITE_URL/robots.txt")
          grep -q '<urlset' <(curl --silent --show-error --location "$SITE_URL/sitemap.xml")
      - name: Publish audit summary
        if: always()
        run: |
          {
            echo "## CLP continuous quality run"
            echo
            echo "- Event: ${ github.event_name }"
            echo "- Commit: ${ github.sha }"
            echo "- SEO and sitemap validators are required to pass."
            echo "- Live smoke tests run on scheduled/manual runs."
            echo "- The fixer is intentionally limited to whitespace hygiene; it does not change content, metadata, redirects, canonical URLs, structured data, privacy or crawler policy."
            echo "- Human review remains mandatory for merge and production deployment."
          } >> "$GITHUB_STEP_SUMMARY"
