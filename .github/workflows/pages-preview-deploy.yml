name: Deploy CLP pull-request preview to GitHub Pages

on:
  workflow_run:
    workflows: ["Deploy CLP website and GitHub Pages PR preview"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: pages-preview-deploy
  cancel-in-progress: false

jobs:
  build-artifact:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download the validated preview artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./_site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Repackage artifact for Pages deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-artifact
    steps:
      - name: Deploy preview artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish preview link on pull request
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ github.event.workflow_run.head_branch }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            const marker = '<!-- clp-github-pages-preview -->';
            const branch = process.env.BRANCH_NAME || '';
            const slug = branch.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            const previewUrl = process.env.PAGE_URL.replace(/\/?$/, '/') + 'previews/' + slug + '/';
            const prs = context.payload.workflow_run.pull_requests || [];
            const pr = prs[0];
            if (!pr || !pr.number) {
              core.setFailed('The completed preview run did not include a pull-request number; refusing to post a potentially incorrect link.');
              return;
            }
            const body = marker + '\n**GitHub Pages branch preview:** ' + previewUrl + '\n\nBuilt from branch `' + branch + '`. The production homepage content remains sourced from the default branch.';
            const { owner, repo } = context.repo;
            const issue_number = pr.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
