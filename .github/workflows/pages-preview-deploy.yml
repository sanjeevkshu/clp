name: Deploy CLP pull-request preview to GitHub Pages

on:
  workflow_run:
    workflows: ["Deploy CLP website and GitHub Pages PR preview"]
    types: [completed]

permissions:
  contents: read

jobs:
  prepare:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout current production source from master
        uses: actions/checkout@v4
        with:
          ref: master
          path: production-source

      - name: Checkout the exact pull-request source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: preview-source

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: production-source

      - name: Build fresh production site from current master
        working-directory: production-source
        run: |
          bundle exec jekyll build --source "$GITHUB_WORKSPACE/production-source" --destination "$GITHUB_WORKSPACE/_site" --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Build preview from the exact pull-request revision
        working-directory: production-source
        env:
          BRANCH_NAME: ${{ github.event.workflow_run.head_branch }}
        run: |
          slug="$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-|-$//g')"
          bundle exec jekyll build --source "$GITHUB_WORKSPACE/preview-source" --destination "$GITHUB_WORKSPACE/_preview_site" --baseurl "${{ steps.pages.outputs.base_path }}/previews/$slug"
          mkdir -p "$GITHUB_WORKSPACE/_site/previews/$slug"
          cp -a "$GITHUB_WORKSPACE/_preview_site/." "$GITHUB_WORKSPACE/_site/previews/$slug/"
          printf 'User-agent: *\nDisallow: /\n' > "$GITHUB_WORKSPACE/_site/previews/$slug/robots.txt"
          test -f "$GITHUB_WORKSPACE/_site/index.html"
          test -f "$GITHUB_WORKSPACE/_site/assets/js/main.js"
          test -f "$GITHUB_WORKSPACE/_site/assets/css/styles.css"
          test -f "$GITHUB_WORKSPACE/_site/previews/$slug/index.html"
          grep -q 'id="site-nav"' "$GITHUB_WORKSPACE/_site/index.html"
          grep -q 'id="home-pathways"' "$GITHUB_WORKSPACE/_site/index.html"
          echo "Validated fresh production site plus preview from exact PR revision: /previews/$slug/"

      - name: Upload validated combined site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    concurrency:
      group: pages
      cancel-in-progress: false
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      pages: write
      id-token: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Deploy the validated current production site plus preview
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 120000
          error_count: 3
          reporting_interval: 5000

      - name: Publish preview link on the matching pull request
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ github.event.workflow_run.head_branch }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            const marker = '<!-- clp-github-pages-preview -->';
            const branch = process.env.BRANCH_NAME || '';
            const slug = branch.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            const pageUrl = process.env.PAGE_URL;
            if (!pageUrl) {
              core.setFailed('GitHub Pages did not return a deployment URL.');
              return;
            }

            const baseUrl = pageUrl.endsWith('/') ? pageUrl : pageUrl + '/';
            const previewUrl = baseUrl + 'previews/' + slug + '/';
            const { owner, repo } = context.repo;
            const headOwner = process.env.HEAD_OWNER || owner;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', head: `${headOwner}:${branch}`, per_page: 100
            });
            const pr = prs[0];
            if (!pr || !pr.number) {
              core.setFailed(`Could not find an open pull request for branch ${headOwner}:${branch}; refusing to post an incorrect preview link.`);
              return;
            }

            const body = marker + '\\n**GitHub Pages branch preview:** ' + previewUrl +
              '\\n\\nBuilt from exact pull-request revision `' + process.env.HEAD_SHA + '`. Production files are rebuilt from current master.';
            const issue_number = pr.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
