name: Disable shared GitHub Pages preview deployment

# Preview deployments were using the same GitHub Pages environment as production.
# Keep this workflow inert until previews can be hosted without replacing the live site.
on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain why preview deployment is disabled
        run: echo "Preview deployment is disabled to protect the production GitHub Pages site."
