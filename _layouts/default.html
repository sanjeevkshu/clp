<!doctype html>
<html lang="{{ site.lang | default: 'en' }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title><meta name="description" content="{{ page.description | default: site.description | escape }}"><meta name="theme-color" content="#0B1F3B"><link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml"><link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}"></head><body>{% include header.html %}<main id="main-content">{{ content }}</main>{% include footer.html %}<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script></body></html>
