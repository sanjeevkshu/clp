<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == '/' %}CLP — Continuous Learning &amp; Progressive Evolution | Learn. Apply. Evolve.{% else %}{{ page.title | escape }} | CLP — Learn. Apply. Evolve.{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <meta name="theme-color" content="#0B1F3B">
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}?v=20261015-clp-theme-control-contextual-hero-v21">
  <link rel="stylesheet" href="{{ '/assets/css/responsive-polish.css' | relative_url }}?v=20261015-clp-responsive-polish-v24">
  <meta property="og:site_name" content="CLP — Continuous Learning &amp; Progressive Evolution">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page.url == '/' %}CLP — Learn. Apply. Evolve.{% else %}{{ page.title | escape }} | CLP{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
  <meta property="og:url" content="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/clp-card-atlas.jpg' | absolute_url }}">
  <meta property="og:image:alt" content="CLP — Continuous Learning &amp; Progressive Evolution">
  <meta property="og:locale" content="en_IN">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.url == '/' %}CLP — Learn. Apply. Evolve.{% else %}{{ page.title | escape }} | CLP{% endif %}">
  <meta name="twitter:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
  <meta name="twitter:image" content="{{ '/assets/images/clp-card-atlas.jpg' | absolute_url }}">
  <meta name="twitter:image:alt" content="CLP — Continuous Learning &amp; Progressive Evolution">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "{{ '/' | absolute_url }}#organization",
        "name": "CLP — Continuous Learning & Progressive Evolution",
        "url": "{{ '/' | absolute_url }}",
        "logo": "{{ '/assets/images/clp-logo.svg' | absolute_url }}",
        "description": {{ site.description | jsonify }}
      },
      {
        "@type": "WebSite",
        "@id": "{{ '/' | absolute_url }}#website",
        "url": "{{ '/' | absolute_url }}",
        "name": "CLP — Continuous Learning & Progressive Evolution",
        "publisher": {"@id": "{{ '/' | absolute_url }}#organization"},
        "inLanguage": "en"
      },
      {
        "@type": "WebPage",
        "@id": "{{ page.url | replace: 'index.html', '' | absolute_url }}#webpage",
        "url": "{{ page.url | replace: 'index.html', '' | absolute_url }}",
        "name": {% if page.url == '/' %}"CLP — Continuous Learning & Progressive Evolution | Learn. Apply. Evolve."{% else %}{{ page.title | jsonify }}{% endif %},
        "description": {{ page.description | default: site.description | jsonify }},
        "isPartOf": {"@id": "{{ '/' | absolute_url }}#website"},
        "inLanguage": "en"
      }
    ]
  }
  </script>
</head>
<body class="{% if page.url == '/' %}home-page{% endif %}">
    {% include header.html %}
  <main id="main-content">{{ content }}</main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
