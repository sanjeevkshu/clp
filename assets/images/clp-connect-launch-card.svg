<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
<title id="title">CLP launch campaign card</title>
<desc id="desc">A dark navy and teal abstract landscape with luminous growth rings, a rising path and the message The world evolves. So should we. Learn. Apply. Evolve.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061329"/><stop offset=".56" stop-color="#0B2444"/><stop offset="1" stop-color="#063D60"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20D7F4"/><stop offset=".62" stop-color="#00A7E9"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#20D7F4" stop-opacity=".38"/><stop offset="1" stop-color="#20D7F4" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="627" fill="url(#bg)"/>
<circle cx="960" cy="278" r="310" fill="url(#aura)"/>
<g fill="none" stroke="url(#glow)" stroke-opacity=".48">
  <ellipse cx="940" cy="340" rx="335" ry="124" transform="rotate(-24 940 340)" stroke-width="2"/>
  <ellipse cx="940" cy="340" rx="280" ry="98" transform="rotate(-24 940 340)" stroke-width="2"/>
  <ellipse cx="940" cy="340" rx="225" ry="73" transform="rotate(-24 940 340)" stroke-width="2"/>
  <path d="M670 525 C760 445 795 465 862 365 S1002 240 1115 125" stroke-width="4" stroke-linecap="round"/>
</g>
<path d="M620 627 L760 472 L835 520 L946 354 L1030 427 L1155 264 L1200 303 L1200 627Z" fill="#0B1F3B" opacity=".82"/>
<path d="M620 627 L760 472 L835 520 L946 354 L1030 427 L1155 264 L1200 303" fill="none" stroke="#20D7F4" stroke-opacity=".45" stroke-width="2"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="82" y="100" font-size="20" letter-spacing="7" font-weight="800" fill="#20D7F4">CLP  /  CONTINUOUS LEARNING</text>
  <text x="78" y="245" font-size="66" font-weight="800" letter-spacing="-2.6" fill="#F5FAFF">The world evolves.</text>
  <text x="78" y="322" font-size="66" font-weight="800" letter-spacing="-2.6" fill="#72E9FA">So should we.</text>
  <path d="M82 365 H280" stroke="#20D7F4" stroke-width="4" stroke-linecap="round"/>
  <text x="82" y="423" font-size="25" font-weight="700" letter-spacing="4" fill="#F5FAFF">LEARN  ·  APPLY  ·  EVOLVE</text>
  <text x="82" y="470" font-size="19" fill="#C6D9E9">Ideas, skills and experiences for a changing world.</text>
</g>
<rect x="36" y="36" width="1128" height="555" rx="24" fill="none" stroke="#8CEEFF" stroke-opacity=".18"/>
</svg>
