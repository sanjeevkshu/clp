<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">Seven-day AI productivity challenge</title><desc id="desc">Seven connected milestones lead from observing a task to reflecting on results.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111b3d"/><stop offset="1" stop-color="#4a286e"/></linearGradient></defs><rect width="760" height="420" fill="url(#bg)"/><circle cx="610" cy="110" r="160" fill="#8b5cf6" opacity=".18"/><text x="48" y="66" font-family="Arial,sans-serif" fill="#d9d0ff" font-size="16" font-weight="700" letter-spacing="3">CLP EVOLUTION LAB</text><text x="48" y="112" font-family="Arial,sans-serif" fill="#fff" font-size="32" font-weight="700">Seven days. One real experiment.</text><path d="M88 230H674" stroke="#9b8bea" stroke-width="5" stroke-linecap="round"/><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#25244f" stroke="#bdb0ff" stroke-width="3"><circle cx="88" cy="230" r="27"/><circle cx="186" cy="230" r="27"/><circle cx="284" cy="230" r="27"/><circle cx="382" cy="230" r="27"/><circle cx="480" cy="230" r="27"/><circle cx="578" cy="230" r="27"/><circle cx="674" cy="230" r="27"/></g><g fill="#fff" font-size="19" font-weight="700"><text x="88" y="237">1</text><text x="186" y="237">2</text><text x="284" y="237">3</text><text x="382" y="237">4</text><text x="480" y="237">5</text><text x="578" y="237">6</text><text x="674" y="237">7</text></g><g fill="#eeeaff" font-size="14"><text x="88" y="285">Observe</text><text x="186" y="285">Define</text><text x="284" y="285">Assist</text><text x="382" y="285">Improve</text><text x="480" y="285">Verify</text><text x="578" y="285">Repeat</text><text x="674" y="285">Reflect</text></g><rect x="48" y="325" width="664" height="50" rx="15" fill="#ffffff" opacity=".1" stroke="#bdb0ff" stroke-opacity=".6"/><text x="380" y="356" fill="#fff" font-size="17">Measure quality · time · corrections · risk</text></g></svg>