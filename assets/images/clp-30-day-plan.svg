<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">30-day AI learning plan</title><desc id="desc">Four stages represent learning, practising, applying, and reflecting.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#173c42"/><stop offset="1" stop-color="#0a2340"/></linearGradient></defs><rect width="760" height="420" fill="url(#bg)"/><circle cx="590" cy="80" r="150" fill="#20d7f4" opacity=".08"/><text x="48" y="67" font-family="Arial,sans-serif" fill="#c7fbf2" font-size="16" font-weight="700" letter-spacing="3">CLP MASTERCLASS</text><text x="48" y="115" font-family="Arial,sans-serif" fill="#fff" font-size="35" font-weight="700">30 days. One useful skill.</text><g font-family="Arial,sans-serif"><rect x="48" y="155" width="664" height="62" rx="14" fill="#f2f0e7"/><rect x="48" y="155" width="14" height="62" rx="7" fill="#20d7f4"/><text x="85" y="193" fill="#173c42" font-size="23" font-weight="700">01</text><text x="145" y="193" fill="#173c42" font-size="21">Learn the foundations</text><text x="665" y="193" fill="#257c7c" font-size="15" text-anchor="end">DAYS 1–7</text><rect x="48" y="230" width="664" height="62" rx="14" fill="#e4f5ee"/><rect x="48" y="230" width="14" height="62" rx="7" fill="#4cae91"/><text x="85" y="268" fill="#173c42" font-size="23" font-weight="700">02</text><text x="145" y="268" fill="#173c42" font-size="21">Practise deliberately</text><text x="665" y="268" fill="#257c7c" font-size="15" text-anchor="end">DAYS 8–14</text><rect x="48" y="305" width="664" height="45" rx="12" fill="#d5ebf4"/><text x="78" y="334" fill="#173c42" font-size="19" font-weight="700">03  Apply to real work</text><text x="665" y="334" fill="#257c7c" font-size="14" text-anchor="end">DAYS 15–21</text><rect x="48" y="360" width="664" height="42" rx="12" fill="#d9d4ff"/><text x="78" y="387" fill="#252c55" font-size="18" font-weight="700">04  Reflect and improve · Days 22–30</text></g></svg>